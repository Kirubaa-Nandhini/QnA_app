{% extends "questions/base.html" %}
{% block title %}Delete Answer — QnA App{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">

    <!-- Breadcrumb -->
    <nav class="mb-6 text-sm text-gray-500">
        <a href="{% url 'questions:list' %}" class="hover:text-indigo-400 transition">Questions</a>
        <span class="mx-2">/</span>
        <a href="{% url 'questions:detail' answer.question.pk %}" class="hover:text-indigo-400 transition">Detail</a>
        <span class="mx-2">/</span>
        <span class="text-red-400">Delete Answer</span>
    </nav>

    <div class="bg-gray-900 border border-red-700/30 rounded-2xl p-8">
        <!-- Warning icon -->
        <div class="w-14 h-14 bg-red-900/30 rounded-full flex items-center justify-center mb-5">
            <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Delete Answer?</h1>
        <p class="text-gray-400 mb-6">This action is <span class="text-red-400 font-semibold">permanent</span> and
            cannot be undone.</p>

        <!-- Answer preview -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 mb-8">
            <p class="text-gray-300 leading-relaxed italic">{{ answer.text }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="flex items-center gap-3">
                <button type="submit"
                    class="bg-red-600 hover:bg-red-500 text-white font-semibold px-6 py-2.5 rounded-xl transition">
                    Yes, delete it
                </button>
                <a href="{% url 'questions:detail' answer.question.pk %}"
                    class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 hover:text-white font-semibold px-6 py-2.5 rounded-xl transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
