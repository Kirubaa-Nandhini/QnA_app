<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}QnA App{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#6366f1', dark: '#4f46e5', light: '#a5b4fc' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="bg-gray-950 text-gray-100 font-sans min-h-screen antialiased">

  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'questions:list' %}"
        class="flex items-center gap-2 text-brand font-bold text-xl tracking-tight hover:opacity-80 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3
               0 1.4-.9 2.6-2.25 3.15l-.5.2C12.45 13.75 12 14.4 12
               15m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        QnA App
      </a>

      <div class="flex items-center gap-4">
        {% if user.is_authenticated %}
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-400 font-medium whitespace-nowrap">Hi, {{ user.username }}</span>
          <a href="{% url 'users:profile' %}"
            class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 text-xs font-bold px-3 py-1.5 rounded-lg transition">View
            Profile</a>
          <form action="{% url 'users:logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button type="submit" class="text-sm font-semibold text-gray-300 hover:text-white transition">Log
              Out</button>
          </form>
        </div>
        {% else %}
        <a href="{% url 'users:login' %}" class="text-sm font-semibold text-gray-300 hover:text-white transition">Log
          In</a>
        <a href="{% url 'users:signup' %}"
          class="bg-brand hover:bg-brand-dark text-white text-sm font-bold px-5 py-2 rounded-xl transition shadow-lg shadow-indigo-500/20">Sign
          Up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="max-w-5xl mx-auto px-4 pt-4">
    {% for message in messages %}
    <div class="mb-2 px-4 py-3 rounded-lg text-sm font-medium
      {% if message.tags == 'error' %}bg-red-900/50 text-red-300 border border-red-700
      {% else %}bg-green-900/50 text-green-300 border border-green-700{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Main content -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800 mt-16 py-6 text-center text-gray-600 text-sm">
    QnA App &mdash; Built with Django &amp; Tailwind CSS
  </footer>

</body>

</html>
