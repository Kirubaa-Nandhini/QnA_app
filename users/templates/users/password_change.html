{% extends "questions/base.html" %}

{% block title %}Change Password — QnA App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 text-center">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 shadow-2xl text-left">
        <h1 class="text-3xl font-bold text-white mb-8">Update Password</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-5">
                {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-300 mb-1.5">
                        {{ field.label }}
                    </label>
                    <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}"
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
                    {% if field.errors %}
                    <div class="mt-1.5">
                        {% for error in field.errors %}
                        <p class="text-xs text-rose-400 font-medium">{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit"
                    class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-4">
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
