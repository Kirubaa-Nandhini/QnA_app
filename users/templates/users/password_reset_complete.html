{% extends "questions/base.html" %}

{% block title %}Success — QnA App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 text-center">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 shadow-2xl">
        <div
            class="w-16 h-16 bg-green-500/10 text-green-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-4">Success!</h1>
        <p class="text-gray-400 mb-8 leading-relaxed">
            Your password has been successfully set. You may now log in.
        </p>
        <a href="{% url 'users:login' %}"
            class="inline-block bg-brand hover:bg-brand-dark text-white font-bold px-10 py-3.5 rounded-xl transition shadow-lg">
            Log In
        </a>
    </div>
</div>
{% endblock %}
