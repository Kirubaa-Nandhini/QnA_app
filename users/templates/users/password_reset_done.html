{% extends "questions/base.html" %}

{% block title %}Email Sent — QnA App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 text-center">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 shadow-2xl">
        <div
            class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-4">Check Your Inbox</h1>
        <p class="text-gray-400 mb-8 leading-relaxed">
            We've sent a password reset link to your email. If you don't see it, check your spam folder.
        </p>
        <a href="{% url 'users:login' %}"
            class="inline-block bg-gray-800 hover:bg-gray-700 text-white font-bold px-8 py-3 rounded-xl transition">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
